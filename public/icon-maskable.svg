    <path d="M16 2 L28 7 v9 c0 7.2-5 12.6-12 14.9C9 28.6 4 23.2 4 16 V7 z" fill="none" stroke="#4f46e5" stroke-width="1.8"/>
    <path d="M16 15.6 L10.5 18.6 M16 15.6 L21.5 18.6 M10.5 20 L21.5 20" stroke="#4f46e5" stroke-width="1.3" opacity="0.65"/>
    <circle cx="16" cy="13" r="2.6" fill="#4f46e5"/>
