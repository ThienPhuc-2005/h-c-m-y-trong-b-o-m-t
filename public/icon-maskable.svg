<!-- Bản "maskable": hệ điều hành có thể cắt biểu tượng thành tròn, vuông bo góc
     hay giọt nước tuỳ máy. Vì vậy hình chính phải nằm gọn trong vùng an toàn —
     đường tròn đường kính 80% ở giữa — và nền phải phủ kín khung, nếu không sẽ
     lộ ra viền trắng lởm chởm sau khi cắt. -->
